name: Build Pico Firmware
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 1.5.1
          path: pico-sdk

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake python3 build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Build UF2
        run: |
          export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
          mkdir build && cd build
          cmake .. -DPICO_COPY_TO_RAM=1
          make -j4

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_nupogodi_firmware
          path: build/*.uf2
